  <circle cx="32" cy="32" r="24.5" stroke="#8A6347" stroke-width="0.8" opacity="0.7" />

  <!-- Botanical Herbals Emblem (resembling Hiba Herbals label floral crest) -->
  <!-- Center stem and bloom -->
